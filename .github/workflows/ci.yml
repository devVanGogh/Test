name: synthetic-ci
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check sharing boundaries
        run: python tools/safe_share_check.py
      - name: Synthetic unit tests
        run: python -m unittest discover -s tests -v
